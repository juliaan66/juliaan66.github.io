.trow .tbody { flex: 1; min-width: 0; }
.trow .tname { font-weight: 600; line-height: 1.3; }
.trow p { margin: 3px 0 8px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.tused { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tused .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; }
.plink { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; min-height: 30px; }
.plink:hover { border-color: var(--muted); }

/* Path */
.timeline { list-style: none; margin: 0 0 0 6px; padding: 0; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 32px 26px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.timeline .when { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.timeline h3 { font-size: 19px; margin: 4px 0 6px; font-weight: 600; }
.timeline p { margin: 0; color: var(--muted); max-width: 64ch; }

/* Contact */
.contact { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 40px 22px; margin: 72px 0 40px; }
@media (min-width: 720px) { .contact { padding: 56px; } }
.contact h2 { font-family: var(--font-display); font-size: clamp(32px, 5vw, 52px); letter-spacing: -0.02em; margin: 0 0 12px; line-height: 1.05; }
.contact p { margin: 0 0 26px; opacity: .8; max-width: 56ch; }
.mail { font-family: var(--font-mono); font-size: clamp(15px, 3.4vw, 22px); word-break: break-all; display: block; margin-bottom: 22px; text-decoration: none; }
.mail:hover { text-decoration: underline; }
.contact .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.cbtn { border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); background: transparent; color: var(--bg); border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; }
.cbtn:hover { background: color-mix(in srgb, var(--bg) 12%, transparent); }
.cbtn.main { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.cbtn svg { width: 16px; height: 16px; }
footer { padding: 0 0 40px; font-size: 13px; color: var(--muted); }

  }

  /* ---------- Demos ---------- */
  function logLine(box, text) {
    var old = box.querySelector(".new"); if (old) old.classList.remove("new");
    var d = document.createElement("div"); d.className = "new"; d.textContent = text;
    box.insertBefore(d, box.firstChild);
  }

  var DEMOS = {
    gaz: function (el) {
      var es = lang === "es";
      var st = { online: true, n: 15, server: 2, rows: [{ id: 13, ok: true }, { id: 14, ok: true }] };
      el.innerHTML =
        '<div class="demo-bar">GAZMULA · ' + (es ? "Municipio de ejemplo" : "Sample town") +
          '<button type="button" class="switch sp" role="switch" aria-checked="true" id="gNet"><i></i><span></span></button></div>' +
        '<div class="demo-body">' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
            '<button type="button" class="btn primary" id="gAdd">+ ' + (es ? "Registrar menor" : "Register child") + "</button>" +
            '<span class="state s-info" id="gServer"></span>' +
          "</div>" +
          '<div id="gRows" style="display:flex;flex-direction:column;gap:6px"></div>' +
          '<div class="demo-log" id="gLog" aria-live="polite"></div>' +
        "</div>" +
        '<div class="demo-note">' + (es ? "Recreación interactiva. Quita la conexión, registra menores y vuelve a conectar: los cambios se sincronizan solos." : "Interactive recreation. Turn the connection off, register children and turn it back on: changes sync by themselves.") + "</div>";
      var net = el.querySelector("#gNet"), rows = el.querySelector("#gRows"), log = el.querySelector("#gLog"), srv = el.querySelector("#gServer");
      function draw() {
        net.setAttribute("aria-checked", String(st.online));
        net.querySelector("span").textContent = st.online ? (es ? "Con conexión" : "Online") : (es ? "Sin conexión" : "Offline");
        srv.textContent = (es ? "Servidor central: " : "Central server: ") + st.server + (es ? " registros" : " records");
        rows.innerHTML = st.rows.slice().reverse().slice(0, 4).map(function (r) {
          return '<div class="row"><div class="grow">' + (es ? "Familia Nº " : "Family No. ") + pad3(r.id) +
            "<small>" + (es ? "Menor, guardadores y documentos" : "Child, guardians and documents") + "</small></div>" +
            '<span class="state ' + (r.ok ? "s-ok" : "s-wait") + '">' + (r.ok ? (es ? "Sincronizado" : "Synced") : (es ? "Pendiente" : "Pending")) + "</span></div>";
        }).join("");
      }
      function sync() {
        var pend = st.rows.filter(function (r) { return !r.ok; });
        if (!st.online || !pend.length) return;
        logLine(log, es ? "Sincronizando " + pend.length + " cambio(s)…" : "Syncing " + pend.length + " change(s)…");
        setTimeout(function () {
          if (!st.online) return;
          var still = pend.filter(function (r) { return !r.ok; });
          if (!still.length) return;
          still.forEach(function (r) { r.ok = true; });
          st.server += still.length;
          logLine(log, es ? "✓ " + still.length + " cambio(s) en el servidor, sin conflictos" : "✓ " + still.length + " change(s) on the server, no conflicts");
          draw();
        }, 700);
      }
      net.addEventListener("click", function () {
        st.online = !st.online;
        logLine(log, st.online ? (es ? "Conexión recuperada" : "Back online") : (es ? "Sin conexión · se sigue trabajando en local" : "Offline · still working locally"));
        draw(); sync();
      });
      el.querySelector("#gAdd").addEventListener("click", function () {
        var r = { id: st.n++, ok: false }; st.rows.push(r);
        logLine(log, (es ? "Guardado en local: Familia Nº " : "Saved locally: Family No. ") + pad3(r.id));
        draw(); sync();
      });
      logLine(log, es ? "Base de datos local abierta" : "Local database opened");
      draw();
    },

    fact: function (el) {
      var es = lang === "es";
      function init() { return [
        { n: "F2026-0045", c: es ? "Cliente A" : "Client A", total: "1.210,00 €", s: "GENERADA" },
        { n: "F2026-0046", c: es ? "Cliente B" : "Client B", total: "363,00 €", s: "GENERADA", err: true },
        { n: "F2026-0047", c: es ? "Cliente C" : "Client C", total: "96,80 €", s: "EN_REVISION" }
      ]; }
      var inv = init();
      var cls = { GENERADA: "s-info", EN_REVISION: "s-wait", LISTA: "s-ok", CANCELADA: "s-muted" };
      el.innerHTML =
        '<div class="demo-bar">' + (es ? "Cola de revisión" : "Review queue") + '<button type="button" class="btn sp" id="fReset">' + (es ? "Reiniciar" : "Reset") + "</button></div>" +
        '<div class="demo-body"><div id="fRows" style="display:flex;flex-direction:column;gap:6px"></div><div class="demo-log" id="fLog" aria-live="polite"></div></div>' +
        '<div class="demo-note">' + (es ? "Recreación interactiva de la máquina de estados. «Listo» solo funciona si la factura no tiene errores; las facturas listas o canceladas ya no se pueden tocar." : "Interactive recreation of the state machine. “Ready” only works when the invoice has no errors; ready or cancelled invoices can no longer be changed.") + "</div>";
      var rows = el.querySelector("#fRows"), log = el.querySelector("#fLog");

      function draw() {

          if (f.s === "EN_REVISION" && f.err) b += '<button type="button" class="btn" data-a="fix" data-i="' + i + '">' + (es ? "Corregir NIF" : "Fix tax ID") + "</button>";
          if (f.s === "EN_REVISION") b += '<button type="button" class="btn primary" data-a="ok" data-i="' + i + '"' + (f.err ? " disabled" : "") + ">" + (es ? "Listo" : "Ready") + "</button>";
          if (f.s === "GENERADA" || f.s === "EN_REVISION") b += '<button type="button" class="btn" data-a="cancel" data-i="' + i + '">' + (es ? "Cancelar" : "Cancel") + "</button>";
          return '<div class="row"><div class="grow"><span class="mono">' + f.n + "</span> · " + esc(f.c) + "<small>" + f.total +
            (f.err ? ' · <span style="color:var(--bad)">' + (es ? "NIF no válido" : "Invalid tax ID") + "</span>" : "") + "</small></div>" +
            '<span class="state ' + cls[f.s] + '">' + f.s + "</span>" + b + "</div>";
        }).join("");
        rows.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var i = +btn.dataset.i, a = btn.dataset.a;
            if (a === "rev") move(i, "EN_REVISION");
            if (a === "ok") move(i, "LISTA");
            if (a === "cancel") move(i, "CANCELADA");
            if (a === "fix") { inv[i].err = false; logLine(log, inv[i].n + (es ? ": NIF corregido, validación correcta" : ": tax ID fixed, validation passed")); draw(); }

      el.querySelector("#fReset").addEventListener("click", function () { inv = init(); logLine(log, es ? "Cola reiniciada" : "Queue reset"); draw(); });
      logLine(log, es ? "3 facturas generadas desde Excel" : "3 invoices generated from Excel");
      draw();
    },

    cal: function (el) {
      var es = lang === "es";
      var now = new Date(), y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
      var days = new Date(y, m + 1, 0).getDate();
      var startDow = (new Date(y, m, 1).getDay() + 6) % 7;
      var dows = es ? ["L", "M", "X", "J", "V", "S", "D"] : ["M", "T", "W", "T", "F", "S", "S"];
      var monthName = new Date(y, m, 1).toLocaleDateString(es ? "es-ES" : "en-GB", { month: "long", year: "numeric" });
      var deadline = Math.min(days, 18), review = Math.min(days, 25);
      function eventsOn(d) {
        var dow = (new Date(y, m, d).getDay() + 6) % 7, out = [];
        if (d === 1) out.push({ c: "#be123c", h: es ? "Todo el día" : "All day", t: es ? "Pagar alquiler" : "Pay rent", r: es ? "cada mes" : "monthly" });
        if (dow === 0 || dow === 2) out.push({ c: "#0f766e", h: "10:00", t: es ? "Clase · Sistemas de Información" : "Class · Information Systems", r: es ? "cada semana (L, X)" : "weekly (Mon, Wed)" });
        if (d === review) out.push({ c: "#7c3aed", h: "17:00", t: es ? "Revisión con la asociación" : "Review with the association", r: "" });
        if (d === deadline) out.push({ c: "#b45309", h: "23:59", t: es ? "Entrega de práctica" : "Assignment due", r: "" });
        return out;
      }
      /* Events the visitor adds: { id, d, h, t, rep: "none" | "daily" | "weekly", c } */
      var mine = [], nextId = 1, sel = today;
      var palette = ["#2563eb", "#db2777", "#ca8a04", "#059669", "#9333ea"];
      var repLabel = {
        none: "",
        daily: es ? "cada día" : "daily",
        weekly: es ? "cada semana" : "weekly"
      };
      var byday = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
      function dowOf(d) { return (new Date(y, m, d).getDay() + 6) % 7; }
      function allOn(d) {
        var out = eventsOn(d).map(function (e) { return { c: e.c, h: e.h, t: e.t, r: e.r }; });
        mine.forEach(function (e) {
          var hit = e.d === d || (e.rep === "daily" && d > e.d) || (e.rep === "weekly" && d > e.d && dowOf(d) === dowOf(e.d));
          if (hit) out.push({ c: e.c, h: e.h, t: e.t, r: repLabel[e.rep], id: e.id });
        });
        return out.sort(function (a, b) { return a.h < b.h ? -1 : a.h > b.h ? 1 : 0; });
      }
      el.innerHTML =
        '<div class="demo-bar"><span>' + esc(monthName.charAt(0).toUpperCase() + monthName.slice(1)) + '</span><span class="state s-info sp">.ics → iPhone</span></div>' +
        '<div class="demo-body">' +
          '<div class="toast" id="cToast"><div class="grow"><strong>' + (es ? "Aviso" : "Reminder") + "</strong> · " + (es ? "Entrega de práctica en 10 min" : "Assignment due in 10 min") + "</div>" +
            '<button type="button" class="btn" data-t="snooze">' + (es ? "Posponer" : "Snooze") + '</button><button type="button" class="btn" data-t="close">' + (es ? "Descartar" : "Dismiss") + "</button></div>" +
          '<div class="cal-grid" id="cGrid"></div>' +
          '<form class="cal-form" id="cForm">' +
            '<p class="cal-form-title" id="cFormTitle"></p>' +
            '<input class="field grow" id="cTitle" maxlength="60" autocomplete="off" required placeholder="' + (es ? "Nombre del evento" : "Event name") + '" aria-label="' + (es ? "Nombre del evento" : "Event name") + '"/>' +
            '<input class="field" id="cTime" type="time" value="09:00" required aria-label="' + (es ? "Hora" : "Time") + '"/>' +
            '<select class="field" id="cRep" aria-label="' + (es ? "Repetición" : "Repeat") + '">' +
              '<option value="none">' + (es ? "No se repite" : "Does not repeat") + "</option>" +
              '<option value="daily">' + (es ? "Cada día" : "Every day") + "</option>" +
              '<option value="weekly">' + (es ? "Cada semana" : "Every week") + "</option>" +
            "</select>" +
            '<button class="btn primary" type="submit">' + (es ? "Añadir" : "Add") + "</button>" +
          "</form>" +
          '<div class="cal-list" id="cList" aria-live="polite"></div>' +
          '<div class="cal-ics mono" id="cIcs" hidden></div>' +
        "</div>" +
        '<div class="demo-note">' + (es ? "Recreación interactiva. Elige un día, añade un evento (puede repetirse) y mira la línea que se enviaría al iPhone en el feed .ics." : "Interactive recreation. Pick a day, add an event (it can repeat) and see the line that would go to the iPhone in the .ics feed.") + "</div>";
      var list = el.querySelector("#cList"), gridEl = el.querySelector("#cGrid"), icsEl = el.querySelector("#cIcs");
      function drawGrid() {
        var g = dows.map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
        for (var i = 0; i < startDow; i++) g += '<div class="cal-day out"></div>';
        for (var d = 1; d <= days; d++) {
          var ev = allOn(d);
          g += '<button type="button" class="cal-day' + (d === today ? " today" : "") + '" data-d="' + d + '" aria-pressed="' + (d === sel) + '" aria-label="' + d + " · " + ev.length + (es ? " eventos" : " events") + '">' + d +
            '<span class="cal-dots">' + ev.slice(0, 4).map(function (e) { return '<span style="background:' + e.c + '"></span>'; }).join("") + "</span></button>";
        }
        gridEl.innerHTML = g;
        gridEl.querySelectorAll(".cal-day[data-d]").forEach(function (b) { b.addEventListener("click", function () { show(+b.dataset.d); }); });
      }
      function show(d) {
        sel = d;
        gridEl.querySelectorAll(".cal-day[data-d]").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.d === d)); });
        el.querySelector("#cFormTitle").textContent = (es ? "Nuevo evento el día " : "New event on day ") + d;
        var ev = allOn(d);
        if (!ev.length) { list.innerHTML = '<div class="cal-item muted">' + d + " · " + (es ? "Sin eventos" : "No events") + "</div>"; return; }
        list.innerHTML = ev.map(function (e) {
          return '<div class="cal-item"><span class="cdot" style="background:' + e.c + '"></span><span class="grow">' + esc(e.h) + " · " + esc(e.t) + (e.r ? ' <span class="muted">(' + esc(e.r) + ")</span>" : "") + "</span>" +
            (e.id ? '<button type="button" class="cal-del" data-id="' + e.id + '" aria-label="' + (es ? "Borrar evento" : "Delete event") + '">✕</button>' : "") + "</div>";
        }).join("");
        list.querySelectorAll(".cal-del").forEach(function (b) {
          b.addEventListener("click", function () {
            mine = mine.filter(function (e) { return e.id !== +b.dataset.id; });
            icsEl.hidden = true;
            drawGrid(); show(sel);
          });
        });
      }
      el.querySelector("#cForm").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var title = el.querySelector("#cTitle").value.trim();
        var time = el.querySelector("#cTime").value || "09:00";
        var rep = el.querySelector("#cRep").value;
        if (!title) return;
        var e = { id: nextId++, d: sel, h: time, t: title, rep: rep, c: palette[(nextId - 2) % palette.length] };
        mine.push(e);
        el.querySelector("#cTitle").value = "";
        var dt = String(y) + ("0" + (m + 1)).slice(-2) + ("0" + sel).slice(-2) + "T" + time.replace(":", "") + "00";
        var rule = rep === "daily" ? " · RRULE:FREQ=DAILY" : rep === "weekly" ? " · RRULE:FREQ=WEEKLY;BYDAY=" + byday[dowOf(sel)] : "";
        icsEl.textContent = "DTSTART:" + dt + rule + " · SUMMARY:" + title;
        icsEl.hidden = false;
        drawGrid(); show(sel);
      });
      drawGrid();
      var toast = el.querySelector("#cToast");
      toast.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.dataset.t === "snooze") {
            toast.querySelector(".grow").innerHTML = "<strong>" + (es ? "Pospuesto" : "Snoozed") + "</strong> · " + (es ? "aviso otra vez en 5 min" : "reminding again in 5 min");
            b.remove();
          } else { toast.remove(); }
        });
      });
      show(today);
    },

    wasa: function (el) {
      var es = lang === "es";
      var nextMsg = 100;
      var convs = [
        { id: 1, name: "Marco", msgs: [{ id: 97, me: false, t: "Ciao! Hai finito il progetto?" }, { id: 98, me: true, t: es ? "¡Casi! Me falta Docker" : "Almost! Just Docker left" }] },
        { id: 2, name: es ? "Grupo WASA" : "WASA group", msgs: [{ id: 99, me: false, t: es ? "La entrega es el viernes" : "Deadline is Friday" }] }
      ];
      var cur = 0;
      el.innerHTML =
        '<div class="demo-bar">WasaText<span class="state s-ok sp">' + (es ? "Sesión iniciada" : "Logged in") + "</span></div>" +
        '<div class="demo-body"><div class="chat"><div class="convs" id="wConvs"></div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="msgs" id="wMsgs" aria-live="polite"></div>' +
          '<form class="compose" id="wForm"><input id="wIn" maxlength="120" autocomplete="off" placeholder="' + (es ? "Escribe un mensaje" : "Write a message") + '" aria-label="' + (es ? "Mensaje" : "Message") + '"/><button class="btn primary" type="submit">' + (es ? "Enviar" : "Send") + "</button></form></div></div>" +
          '<div class="demo-log" id="wLog"></div></div>' +
        '<div class="demo-note">' + (es ? "Recreación interactiva. Cambia de conversación, envía o borra mensajes y mira las llamadas a la API REST." : "Interactive recreation. Switch conversations, send or delete messages and watch the REST API calls.") + "</div>";
      var cEl = el.querySelector("#wConvs"), mEl = el.querySelector("#wMsgs"), log = el.querySelector("#wLog");
      function drawConvs() {
        cEl.innerHTML = convs.map(function (c, i) { return '<button type="button" class="conv" aria-pressed="' + (i === cur) + '" aria-selected="' + (i === cur) + '" data-i="' + i + '">' + esc(c.name) + "</button>"; }).join("");
        cEl.querySelectorAll(".conv").forEach(function (b) {
          b.addEventListener("click", function () {
            cur = +b.dataset.i; drawConvs(); drawMsgs();
            logLine(log, "GET /conversations/" + convs[cur].id + "/messages → 200");
          });
        });
      }
      function drawMsgs() {
        var c = convs[cur];
        mEl.innerHTML = c.msgs.map(function (m, i) {
          return '<div class="msg' + (m.me ? " me" : "") + '"><span>' + esc(m.t) + "</span>" + (m.me ? '<button type="button" data-i="' + i + '" aria-label="' + (es ? "Borrar mensaje" : "Delete message") + '">✕</button>' : "") + "</div>";
        }).join("");
        mEl.scrollTop = mEl.scrollHeight;
        mEl.querySelectorAll("button").forEach(function (b) {
          b.addEventListener("click", function () {
            var m = c.msgs.splice(+b.dataset.i, 1)[0];
            logLine(log, "DELETE /messages/" + m.id + " → 204");
            drawMsgs();
          });
        });
      }
      el.querySelector("#wForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var inp = el.querySelector("#wIn"), v = inp.value.trim();
        if (!v) return;
        var id = nextMsg++;
        convs[cur].msgs.push({ id: id, me: true, t: v }); inp.value = "";
        logLine(log, "POST /conversations/" + convs[cur].id + "/messages → 201 (id " + id + ")");
        drawMsgs();
      });
      logLine(log, "POST /session → 201");
      logLine(log, "GET /conversations → 200");
      drawConvs(); drawMsgs();
    }
  };

  renderAll();
})();
